<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex · Felps Edition</title>
    <meta name="description" content="Pokédex feita com a PokéAPI: busque qualquer Pokémon por nome ou número e veja tipos, habilidades e estatísticas base.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://pokeapi.co" crossorigin>
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <script>
        // Aplica o tema salvo antes da pintura para evitar flash.
        try {
            const tema = localStorage.getItem('tema');
            if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
        } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="marca" href="./" aria-label="Pokédex, página inicial">
            <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <path d="M2 16h9M21 16h9" stroke="currentColor" stroke-width="2.5"/>
                <circle cx="16" cy="16" r="4.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <path d="M2.2 14A14 14 0 0 1 29.8 14H20.4a4.6 4.6 0 0 0-8.8 0Z" fill="var(--accent)"/>
            </svg>
            <span class="marca-texto">Pokédex <small>Felps Edition</small></span>
        </a>
        <button type="button" class="botao-icone" id="alternarTema" aria-label="Alternar tema claro/escuro">
            <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
    </header>

    <main class="conteudo">
        <form class="busca" id="form" role="search" novalidate>
            <label for="pokemonName" class="busca-rotulo">Buscar Pokémon</label>
            <div class="busca-linha">
                <input type="search" id="pokemonName" name="pokemonName"
                       placeholder="Nome ou número, ex.: pikachu ou 25"
                       autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"
                       aria-describedby="buscaDica">
                <button type="submit" class="botao-primario">Buscar</button>
            </div>
            <p id="buscaDica" class="busca-dica">Pressione Enter para buscar. Use as setas do cartão para navegar pela numeração.</p>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <article class="cartao" id="cartao" hidden aria-labelledby="pokemonNome">
            <div class="cartao-topo">
                <button type="button" class="botao-icone botao-nav" id="anterior" aria-label="Pokémon anterior">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <img id="pokemonImg" alt="" width="475" height="475" decoding="async">
                <button type="button" class="botao-icone botao-nav" id="proximo" aria-label="Próximo Pokémon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>

            <div class="cartao-corpo">
                <header class="identidade">
                    <p class="numero" id="pokemonNumero"></p>
                    <h1 class="nome" id="pokemonNome"></h1>
                    <ul class="tipos" id="pokemonTipos" aria-label="Tipos"></ul>
                </header>

                <dl class="fatos">
                    <div><dt>Altura</dt><dd id="pokemonAltura"></dd></div>
                    <div><dt>Peso</dt><dd id="pokemonPeso"></dd></div>
                    <div class="fatos-largo"><dt>Habilidades</dt><dd><ul class="habilidades" id="pokemonHabilidades"></ul></dd></div>
                </dl>

                <section class="stats" aria-labelledby="statsTitulo">
                    <div class="stats-cabecalho">
                        <h2 id="statsTitulo">Estatísticas base</h2>
                        <p class="stats-total">Total <strong id="statsTotal"></strong></p>
                    </div>
                    <div class="stats-grafico">
                        <canvas id="statsChart" aria-hidden="true"></canvas>
                    </div>
                    <table class="sr-only">
                        <caption>Estatísticas base</caption>
                        <thead><tr><th scope="col">Atributo</th><th scope="col">Valor</th></tr></thead>
                        <tbody id="statsTabela"></tbody>
                    </table>
                </section>
            </div>
        </article>
    </main>

    <footer class="rodape">
        <p>Dados da <a href="https://pokeapi.co/" rel="noopener">PokéAPI</a> · Feito por <a href="https://github.com/flplemos" rel="noopener">Felipe Lemos</a></p>
    </footer>
</body>
</html>
